name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true

      - name: Verify gofmt formatting
        run: |
          test -z "$(gofmt -l .)" || (echo "Unformatted files found:" && gofmt -l . && exit 1)

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Build packages
        run: CGO_ENABLED=0 go build ./...

      - name: Run tests with race detector
        run: go test -race -v ./...

      - name: Run coverage gate
        run: make coverage-check COVERAGE_THRESHOLD=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  client:
    name: Client (Swift)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Check Go/Swift schema version alignment
        run: |
          GO_SCHEMA=$(sed -n 's/const SchemaVersion = \([0-9]*\).*/\1/p' internal/version/version.go | head -1)
          SWIFT_SCHEMA=$(sed -n 's/.*expectedSchemaVersion = \([0-9]*\).*/\1/p' client/Sources/SymroomFeature/SymroomModule.swift | head -1)
          if [ -z "$GO_SCHEMA" ]; then
            echo "::error::Could not extract schema version from internal/version/version.go"
            exit 1
          fi
          if [ -z "$SWIFT_SCHEMA" ]; then
            echo "::error::Could not extract schema version from client/Sources/SymroomFeature/SymroomModule.swift"
            exit 1
          fi
          if [ "$GO_SCHEMA" != "$SWIFT_SCHEMA" ]; then
            echo "::error::Schema version mismatch! Go: $GO_SCHEMA, Swift: $SWIFT_SCHEMA"
            exit 1
          fi
          echo "Schema versions match: Go=$GO_SCHEMA, Swift=$SWIFT_SCHEMA"

      - name: Build client package
        run: swift build --package-path client

      - name: Run client tests
        run: swift test --package-path client
