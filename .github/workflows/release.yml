name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every release target without publishing, signing, or requiring secrets
        required: false
        default: true
        type: boolean

env:
  GO_VERSION: '1.26.5'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # v4 defaults to Cosign v3, whose sign-blob requires --bundle.
          # goreleaser signs with the v2 invocation, so pin the last v2 release.
          cosign-release: 'v2.6.4'
      - name: Install syft
        run: |
          # Pin syft to a released version with an inline sha256 instead of
          # piping the unpinned install.sh from 'main'.
          SYFT_ARCHIVE="syft_1.51.0_linux_amd64.tar.gz"
          SYFT_SHA256="2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/$SYFT_ARCHIVE" "https://github.com/anchore/syft/releases/download/v1.51.0/$SYFT_ARCHIVE"
          echo "$SYFT_SHA256  $RUNNER_TEMP/$SYFT_ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$SYFT_ARCHIVE" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Dry-run build (all targets, no secrets)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=sign,sbom,publish
      - name: Document release inputs
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          echo 'Release publishing requires GITHUB_TOKEN and GitHub Actions id-token: write permission for keyless cosign.'
          echo 'No signing secret is needed: cosign uses the workflow OIDC identity.'
      - name: Publish signed release with SBOMs
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_ID_TOKEN: ${{ secrets.COSIGN_ID_TOKEN }}
